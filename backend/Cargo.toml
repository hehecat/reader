[package]
name = "reader-dev"
version = "6.0.45"
edition = "2021"
description = "阅读3服务器版 Rust 重构（API/数据兼容 legacy 分支，吸收 SQLite/多规则解析/书籍格式扩展）"
license = "GPL-3.0"

[features]
default = ["dict", "camoufox"]
# 离线词典查询与后台词库构建（可按需关闭以精简核心部署）
dict = []
# 外部 Camoufox 浏览器过盾与交互登录桥接（可按需关闭以精简核心部署）
camoufox = []

[dependencies]
# Web
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
tokio = { version = "1", features = ["full"] }
rust-embed = { version = "8", features = ["debug-embed"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-gzip"] }
tower = "0.5"            # 中间件（Layer/Service trait——GAP 60 Cache-Control）
http = "1"

# 数据库（SQLite）
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros"] }

# HTTP 客户端（书源抓取）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "gzip", "brotli", "deflate", "cookies", "stream"] }

# 序列化/配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"   # 锁(免 unwrap 中毒路径)
dotenvy = "0.15"

# 解析（legado 多规则引擎）
scraper = "0.20"          # CSS Selector
jsonpath_lib = "0.3"      # JSONPath
regex = "1"               # Regex
sxd-document = "0.3"      # XPath（XML 文档）
sxd-xpath = "0.4"         # XPath 求值
boa_engine = "0.19"       # JS 引擎（纯 Rust，书源 JS 规则）

# Edge TTS（微软语音 WebSocket 合成，需启用 rustls-tls-webpki-roots 支持 wss://）
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# 工具
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
des = "0.9"
cipher = "0.4"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"        # 用户密码哈希：argon2id（PHC 格式，默认特性）
uuid = { version = "1", features = ["v4"] }
zhconv = "0.4"
urlencoding = "2"
url = "2"
futures = "0.3"
rand = "0.8"
encoding_rs = "0.8"       # 编码检测（兼容 EncodingDetect）
chardetng = "0.1"         # 统计式编码探测（legacy ICU4J CharsetDetector 对应）
zip = { version = "0.6", default-features = false, features = ["deflate"] }  # EPUB 解包 / 备份归档
flate2 = "1"              # parser/js.rs gzip 工具依赖
aes = "0.8"               # 书源 JS 解密（java.aesBase64DecodeToString）
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
block-padding = "0.3"
quick-xml = "0.41.0"
ttf-parser = "0.24"
notify = "6"              # GAP 170 本地书双轨同步：书仓目录文件监听
fancy-regex = "0.19.0"
# 正文图片代理 webp 转换（仅 jpeg/png/gif/webp 编解码，避免完整 image 依赖面）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
serde_stacker = "0.1"

# 开发/测试构建：完整 debuginfo 让单 crate 编译与链接都慢，且 target/ 膨胀到 20G+。
# 行号表足够看 backtrace；依赖连行号表都不要（依赖出问题只看栈顶就够）。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
opt-level = 2

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.test.build-override]
opt-level = 2

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
