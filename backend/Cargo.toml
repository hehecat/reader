[package]
name = "reader-dev"
version = "6.0.45"
edition = "2021"
description = "阅读3服务器版 Rust 重构（API/数据兼容 legacy 分支，吸收 SQLite/多规则解析/书籍格式扩展）"
license = "GPL-3.0"

[dependencies]
# Web
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
tokio = { version = "1", features = ["full"] }
rust-embed = { version = "8", features = ["debug-embed"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-gzip"] }
tower = "0.5"            # 中间件（Layer/Service trait——GAP 60 Cache-Control）
http = "1"

# 数据库（SQLite，兼容迁移自 JSON storage）
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }

# MongoDB 备份/恢复（backupToMongodb / restoreFromMongodb；默认 feature：rustls TLS + dns-resolver 支持 mongodb+srv://）
mongodb = "3.8"

# HTTP 客户端（书源抓取）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http3", "json", "gzip", "brotli", "deflate", "cookies", "stream"] }

# 序列化/配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"   # 锁(免 unwrap 中毒路径)
dotenvy = "0.15"

# 解析（legado 多规则引擎）
scraper = "0.20"          # CSS Selector
jsonpath_lib = "0.3"      # JSONPath
regex = "1"               # Regex
sxd-document = "0.3"      # XPath（XML 文档）
sxd-xpath = "0.4"         # XPath 求值
boa_engine = "0.19"       # JS 引擎（纯 Rust，书源 JS 规则）

# RSS
feed-rs = "1"

# Edge TTS（微软语音 WebSocket 合成）
tokio-tungstenite = "0.24"

# 工具
# 系统监控（服务监控页：真实内存/CPU——Windows 不再全 0M；默认 features 含进程/CPU 采样）
sysinfo = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
des = "0.9"
cipher = "0.4"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"        # 用户密码哈希：argon2id（PHC 格式，默认特性）
uuid = { version = "1", features = ["v4"] }
zhconv = "0.4"
urlencoding = "2"
url = "2"
futures = "0.3"
rand = "0.8"
once_cell = "1"
encoding_rs = "0.8"       # 编码检测（兼容 EncodingDetect）
chardetng = "0.1"         # 统计式编码探测（legacy ICU4J CharsetDetector 对应）
zip = { version = "0.6", default-features = false, features = ["deflate"] }  # EPUB/CBZ 解包
flate2 = "1"            # UMD 正文 zlib 解压（umdlib 语义）
aes = "0.8"           # 书源 JS 解密（java.aesBase64DecodeToString）
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
block-padding = "0.3"
mobi = "0.8.0"
lopdf = "0.44.0"
quick-xml = "0.41.0"
ttf-parser = "0.24"
notify = "6"           # GAP 170 本地书双轨同步：书仓目录文件监听
fancy-regex = "0.19.0"
# GAP 130 正文图片代理 webp 转换（仅 jpeg/png/gif/webp 编解码，避免完整 image 依赖面）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
serde_stacker = "0.1"

# ---- gui feature（同一二进制的桌面变体：双击开窗口，关窗收托盘）----
# 默认不启用——CLI/musl 静态构建零影响；gui 构建为 glibc 动态链接（webkit2gtk）
tao = { version = "0.30", optional = true }
wry = { version = "0.46", optional = true }
tray-icon = { version = "0.19", optional = true }

[features]
gui = ["dep:tao", "dep:wry", "dep:tray-icon"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
