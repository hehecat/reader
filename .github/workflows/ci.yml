# PR / push 质量门: 后端单测 + clippy, 前端 lint + 类型检查+build
# (build.yml 只负责打镜像并推 GHCR, 不跑测试; 这里补上「合进来之前能不能过」)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # reqwest 的 http3 特性需要该 cfg（与 Dockerfile / backend/.cargo/config.toml 保持一致）
      RUSTFLAGS: --cfg reqwest_unstable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # rust-embed 在编译期要求 #[folder] 目录存在；frontend/dist 不入库，
      # 这里放占位文件（与 Dockerfile builder 阶段同一手法），CI 不跑前端构建
      - name: 占位前端产物
        run: mkdir -p web-ui/dist && printf '<!doctype html><title>ci-placeholder</title>' > web-ui/dist/index.html
      - name: cargo test (lib + 集成)
        run: cargo test --lib --tests
      - name: cargo fmt --check
        run: cargo fmt --check
      # warning 已清零，从这里开始新代码再带 warning 直接红
      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 与 Dockerfile 的 pnpm@11 对齐：pnpm-workspace.yaml 用了 allowBuilds（pnpm 11 语法）
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # build = tsc -b && vite build，顺带做类型检查
      - run: pnpm build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 本机网络配置（内网地址/自建域名/网关网络名）只许写 docker-compose.override.yml（已 gitignore）
      - name: 个人网络配置不得入库
        run: |
          if git grep -nE '192\.168\.|(^|[^0-9.])10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.|\.hehecat\.win|yatori' -- deploy README.md; then
            echo "::error::deploy/ 或 README 出现内网地址/个人域名，请写进 docker-compose.override.yml（已 gitignore）"
            exit 1
          fi
      - name: 运行时 sqlite 不得入库
        run: |
          if git ls-files -- 'deploy/storage/*.db*' | grep -q .; then
            echo "::error::deploy/storage 下的 sqlite 已被跟踪，请 git rm --cached"
            exit 1
          fi
