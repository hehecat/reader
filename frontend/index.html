<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="砚台" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="renderer" content="webkit" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfaf6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171310" />
    <!-- 字体走国内镜像(fonts.loli.net), 且非阻塞加载: 镜像再慢/被墙也不卡首屏, 缺失时回退系统字体栈 -->
    <link rel="preconnect" href="https://fonts.loli.net" />
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin />
    <link
      href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>砚台 · 在线小说阅读</title>
    <style>
      :root {
        --sat: constant(safe-area-inset-top);
        --sat: env(safe-area-inset-top);
        --sar: constant(safe-area-inset-right);
        --sar: env(safe-area-inset-right);
        --sab: constant(safe-area-inset-bottom);
        --sab: env(safe-area-inset-bottom);
        --sal: constant(safe-area-inset-left);
        --sal: env(safe-area-inset-left);
      }
      body::-webkit-scrollbar {
        display: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
