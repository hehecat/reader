# reader 生产 compose: 镜像来自 GHCR (GitHub Actions 构建推送)
# 快速起: cd deploy && docker compose up -d   (无需 .env, 默认单用户)
# 多用户: 复制 .env.example 为 .env, 设 READER_APP_SECURE=true 与邀请码
name: reader

services:
  reader:
    image: ghcr.io/hehecat/reader:latest
    ports:
      # 容器内固定 8080; 宿主端口可用 .env 的 READER_PORT 覆盖
      - "${READER_PORT:-8080}:8080"
    volumes:
      # 用户数据/书架/缓存 sqlite (compose 自动创建)
      - ./storage:/storage/storage
      # 容器内 /data (杂项), 命名 volume 便于备份
      - data:/data
    environment:
      READER_APP_WORKDIR: /storage
      READER_APP_WEB_ROOT: /app/web-ui/dist
      # 书源抓取允许内网地址 (本地书同步等)
      SSRF_ALLOW_PRIVATE: "${SSRF_ALLOW_PRIVATE:-false}"        # 图片/TTS/登录检测放行私网(自建部署)
      READER_ALLOW_PRIVATE_SOURCE: "${READER_ALLOW_PRIVATE_SOURCE:-false}"  # 书源抓取放行私网(局域网/本地书源才开)
      # 搜索抓取重试次数(死源排空速度); 源站普遍慢时可下调
      READER_HTTP_RETRIES: "1"
      READER_BROWSER_FIRST: "0"
      # 多用户开关: 默认单用户; .env 设 true 开启邀请码注册
      READER_APP_SECURE: "${READER_APP_SECURE:-false}"
      # secure 模式必填(可经 .env 覆盖): 注册邀请码
      READER_APP_INVITECODE: "${READER_APP_INVITECODE:-}"
      TZ: Asia/Shanghai
      # AI 阅读助手(OpenAI 兼容端点; 默认关闭 = 不填 BASE_URL/KEY 则面板不可用)
      READER_AI_BASE_URL: "${READER_AI_BASE_URL:-}"
      READER_AI_API_KEY: "${READER_AI_API_KEY:-}"
      READER_AI_MODEL: "${READER_AI_MODEL:-deepseek-v4.1-flash}"
      READER_AI_MAX_TOKENS: "${READER_AI_MAX_TOKENS:-3500}"
    networks:
      - default
      # octopus 网关所在网络: 容器内用 http://octopus:8080/v1 访问, 不出公网
      - yatori_yatori-net
    extra_hosts:
      # 自建番茄源(FQ): 容器内直接解析到内网地址, 避免绕公网 IP 回环(hairpin)偶发超时;
      # 源 URL 保持公网域名不变, 手机在外网仍可用
      - "fq.hehecat.win:192.168.50.3"
    restart: unless-stopped

networks:
  yatori_yatori-net:
    external: true

volumes:
  data:
